name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "GetfranchiseAi/index.html"
      - "GetfranchiseAi/app.js"
      - "GetfranchiseAi/styles.css"
      - "GetfranchiseAi/Logo of Getfranchise.jpg"
      - "output/franchises/GETFRANCHISE_BRAND_DATA_*.json"
      - "scripts/build-site.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build public site
        run: node scripts/build-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
